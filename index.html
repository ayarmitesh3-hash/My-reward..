<div id="app"><p class="muted center">Loading…</p></div>

    a.innerHTML = '<p class="muted center">Still loading. Open this page from your GitHub Pages link (https://YOURNAME.github.io/my-reward/), not as a local file or preview. Also check that app.js, firebase-config.js and style.css are in the same folder.</p>';

}, 8000);
</script>
